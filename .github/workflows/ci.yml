name: CI / Build & Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradlewrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
            

      - name: Auto-bump project version in gradle.properties
        id: bump_version
        run: |
            # Читаем текущую версию
            CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
            
            # Разбиваем на части
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            
            # Увеличиваем PATCH на 1
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            
            # Записываем новую версию обратно в файл 
            sed -i "s/^version=.*/version=$NEW_VERSION/" gradle.properties
            
            # Сохраняем новую версию в переменную окружения для следующих шагов
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Версия обновлена: $CURRENT_VERSION -> $NEW_VERSION"

      - name: Commit and push updated gradle.properties
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
        # [skip ci]  предотвращает бесконечный цикл запусков CI
          commit_message: "chore: auto-bump version to ${{ steps.bump_version.outputs.NEW_VERSION }} [skip ci]"
          file_pattern: gradle.properties

      - name: Build (run tests and create fat JAR)
        run: ./gradlew --no-daemon clean build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_23_X64 || '' }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          release_name: Release v${{ steps.get_version.outputs.VERSION }}
          body: Automated release for version ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

      - name: Upload artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/libs/todo-app-2-${{ steps.get_version.outputs.VERSION }}.jar
          asset_name: todo-app-2-${{ steps.get_version.outputs.VERSION }}.jar
          asset_content_type: application/java-archive